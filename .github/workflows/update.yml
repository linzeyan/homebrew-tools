name: Update formulae and casks

on:
  schedule:
    # 03:00 UTC daily (11:00 Asia/Taipei)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Persisted for the `git push` below.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check upstream releases
        id: check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # -k: an unreachable upstream must not block the remaining tools.
          make -k all

      - name: Commit and push updates
        run: |
          changed=$(git diff --name-only -- Formula Casks)
          if [ -z "$changed" ]; then
            echo "Everything is up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One commit per tool, matching the existing history style.
          for file in $changed; do
            name=$(basename "$file" .rb)
            version=$(grep -E '^[[:space:]]*version "' "$file" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            git add "$file"
            git commit -m "$name bump version to $version"
          done

          git push

      - name: Report update failures
        if: steps.check.outcome == 'failure'
        run: |
          echo "One or more tools failed to update; see the 'Check upstream releases' step."
          exit 1
